<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>KodaikanalEats</title>
</head>
<body>
  <h1>KodaikanalEats</h1>
  <nav>
    <a href="#restaurants">Restaurants</a> | <a href="#booking">Booking</a> | 
    <a href="#offers">Special Offers</a> | <a href="#contact">Contact</a>
  </nav>

  <section id="admin">
    <h2>Admin</h2>
    <form>
      <h3>Admin Login</h3>
      <input type="text" placeholder="Username"><br>
      <input type="password" placeholder="Password"><br>
      <button>Login</button>
    </form>
  </section>

  <section id="restaurants">
    <h2>Find Restaurants</h2>
    <form>
      <input type="text" placeholder="Search by Cuisine or Location">
      <button>Search</button>
    </form>
    <p>Profiles with menus, photos, reviews.</p>
  </section>

  <section id="booking">
    <h2>Table Booking</h2>
    <form>
      <input type="text" placeholder="Restaurant Name"><br>
      <input type="date"><br>
      <input type="time"><br>
      <button>Book Now</button>
    </form>
  </section>

  <section id="offers">
    <h2>Special Offers</h2>
    <p>Discounted meals and festival offers.</p>
  </section>

  <section id="customer">
    <h2>Customer Details</h2>
    <p>Booking history, preferences maintained.</p>
  </section>
</body>
</html>
