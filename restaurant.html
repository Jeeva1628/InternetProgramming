<!DOCTYPE html>
<html>

      <a href="reservations.html">Reservations</a> |

  <main>

      <h2>Welcome to Gourmet Haven</h2>
      <p>Carousel of dishes & ambiance here.</p>

      <p>Appetizers, main courses, desserts with prices.</p>

      <h2>About Us</h2>
      <p>History, chef’s bio, culinary philosophy.</p>

        <input type="date"><br>
        <input type="time"><br>
        <input type="number" placeholder="Guests"><br>

    <section id="contact">
      <h2>Contact</h2>
      <p>Address, phone, email.</p>
      <form>
        <textarea placeholder="Message"></textarea><br>
        <button type="submit">Send</button>
      </form>
    </section>
